  function generateDashboardAuthPassword() {
    const bytes = crypto.getRandomValues(new Uint8Array(15));
    return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  // 32 random bytes, base64url-encoded -- comfortably over app/main.py's own
  // `len(dashboard_session_secret) >= 32` boot guard. Never shown to the
  // visitor (unlike username/password): nothing downstream ever asks them
  // to type it again.
  function generateDashboardAuthSessionSecret() {
    const bytes = crypto.getRandomValues(new Uint8Array(32));
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function setDashboardAuthPasswordVisibility(visible) {
    dashboardAuthPasswordVisible = visible;
    document.getElementById("dashboard-auth-password-input").type = visible ? "text" : "password";
    // The control is an icon, so its label lives in aria-label/title rather
    // than in text -- the strings stay translated, just not rendered.
    const toggle = document.getElementById("dashboard-auth-password-toggle");
    const label = t(visible ? "hide_password_button" : "show_password_button");
    toggle.setAttribute("aria-label", label);
    toggle.setAttribute("title", label);
    toggle.setAttribute("aria-pressed", visible ? "true" : "false");
    // Eye = "reveal it", crossed-out eye = "hide it again".
    // .hidden (the IDL property) doesn't reliably reflect to the real
    // `hidden` attribute on SVGElement in every browser, unlike HTMLElement --
    // toggleAttribute writes the attribute directly, which svg[hidden] (the
    // CSS rule above) actually selects on.
    document.getElementById("dashboard-auth-eye-open").toggleAttribute("hidden", visible);
    document.getElementById("dashboard-auth-eye-closed").toggleAttribute("hidden", !visible);
  }

  // Timers per copy-button id, so a second click before the "Copied!" state
  // reverts doesn't leave a stale timeout racing a fresh one.
  const copyButtonRevertTimers = {};

  function setCopyButtonLabel(button) {
    button.setAttribute("aria-label", t("copy_button"));
    button.setAttribute("title", t("copy_button"));
  }

  function refreshCopyButtonLabels() {
    document.querySelectorAll(".copy-btn").forEach((button) => {

    });
  }

  async function copyValueToClipboard(button) {
    const targetId = button.getAttribute("data-copy-target");
    const value = document.getElementById(targetId).textContent;
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      return;
    }
    if (copyButtonRevertTimers[targetId]) clearTimeout(copyButtonRevertTimers[targetId]);
    const tooltip = button.parentElement.querySelector(".copy-tooltip");
    button.classList.add("copied");
    button.setAttribute("aria-label", t("copy_button_copied"));
    button.setAttribute("title", t("copy_button_copied"));
    // Same SVGElement .hidden caveat as the password-toggle icons above.
    button.querySelector(".copy-icon").toggleAttribute("hidden", true);
    button.querySelector(".copy-check").toggleAttribute("hidden", false);
    tooltip.textContent = t("copy_button_copied");
    tooltip.classList.add("show");
    copyButtonRevertTimers[targetId] = setTimeout(() => {
      button.classList.remove("copied");
      setCopyButtonLabel(button);
      button.querySelector(".copy-icon").toggleAttribute("hidden", false);
      button.querySelector(".copy-check").toggleAttribute("hidden", true);
      tooltip.classList.remove("show");
    }, 2500);
  }

  async function submitDashboardAuth() {
    const usernameInput = document.getElementById("dashboard-auth-username-input");
    const passwordInput = document.getElementById("dashboard-auth-password-input");
    const ackCheckbox = document.getElementById("dashboard-auth-ack-checkbox");
    const errorEl = document.getElementById("dashboard-auth-error");
    errorEl.textContent = "";

      currentDashboardAuthErrorKey = "err_dashboard_auth_empty";
      errorEl.textContent = t("err_dashboard_auth_empty");

    }
    if (password.length < 8) {
      currentDashboardAuthErrorKey = "err_dashboard_auth_password_short";
      errorEl.textContent = t("err_dashboard_auth_password_short");
      return;
    }
    if (!ackCheckbox.checked) {

      errorEl.textContent = t("err_dashboard_auth_ack_required");
      return;
    }
    const submitBtn = document.getElementById("dashboard-auth-submit");
    submitBtn.disabled = true;
    const sessionSecret = generateDashboardAuthSessionSecret();
    let resp, body;
    try {
      resp = await fetch("/api/dashboard-auth/confirm", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password, session_secret: sessionSecret}),
      });
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      submitBtn.disabled = false;
      currentDashboardAuthErrorKey = "err_network";
      errorEl.textContent = t("err_network");
      return;

    if (!body.valid) {
      submitBtn.disabled = false;
      currentDashboardAuthErrorKey = body.reason === "no_session" ? "err_no_session" : "err_dashboard_auth_storage_failed";
      errorEl.textContent = t(currentDashboardAuthErrorKey);
      return;
    }
    try {
      sessionStorage.setItem(STORAGE_KEYS["dashboard-auth"], JSON.stringify({completed: true}));
    } catch (err) {
      // best-effort -- the frame still completes this page view even if
      // the local mirror can't be written.
    }
    completeFrame("dashboard-auth", null, null);
  }

  // Generated once per page load, kept in memory only (not sessionStorage --
  // it's sent to /api/github/validate-app on success and persisted
  // server-side there; it is not needed locally after that). GitHub's API
  // never returns a webhook secret to check it against, so this value only
  // needs to exist long enough for the visitor to copy it into GitHub's
  // form and for validateGithubApp() to submit it alongside the app
  // credentials. A full page reload before validating regenerates a new
  // value -- the visitor re-pastes it into GitHub's webhook-secret field --
  // an acceptable, recoverable cost given this frame has no cross-domain
  // redirect (the mobile tab-discard problem this whole redesign addresses
  // only ever struck frames that navigate away, which this one no longer
  // does at all).
  let githubAppWebhookSecret = null;
  function ensureGithubAppWebhookSecret() {
    if (!githubAppWebhookSecret) {
      githubAppWebhookSecret = base64UrlEncode(crypto.getRandomValues(new Uint8Array(32)));
    }
    return githubAppWebhookSecret;
  }

  function renderGithubAppInstructions() {
    const renderService = readStoredRenderService();
    const homepageUrl = renderService && renderService.service_url
      ? renderService.service_url : "—";

      ? `${renderService.service_url}/webhook` : "—";
    document.getElementById("github-app-homepage-url").textContent = homepageUrl;
    document.getElementById("github-app-webhook-url").textContent = webhookUrl;
    document.getElementById("github-app-webhook-secret").textContent = ensureGithubAppWebhookSecret();
    const ACCESS_LABELS = {read: t("frame2_access_read"), write: t("frame2_access_write")};
    const tbody = document.getElementById("github-app-permissions-table-body");
    tbody.innerHTML = "";
    Object.entries(REQUIRED_PERMISSIONS).forEach(([name, level]) => {
      const tr = document.createElement("tr");
      const nameTd = document.createElement("td");
      nameTd.textContent = name;
      const accessTd = document.createElement("td");
      accessTd.textContent = ACCESS_LABELS[level] || level;
      tr.appendChild(nameTd);
      tr.appendChild(accessTd);
      tbody.appendChild(tr);
    });
  }

  async function validateGithubApp() {
    document.getElementById("github-app-error").textContent = "";
    currentGithubAppErrorKey = null;
    document.getElementById("github-app-checklist").innerHTML = "";
    lastGithubAppChecklistBody = null;
    const renderService = readStoredRenderService();
    if (!renderService || !renderService.service_url) {
      githubAppError("err_github_no_render_service");
      return;
    }
    const appIdRaw = document.getElementById("github-app-id-input").value.trim();
    if (!/^[0-9]+$/.test(appIdRaw) || Number(appIdRaw) <= 0) {
      githubAppError("err_github_app_id_invalid");
      return;
    }
    const fileInput = document.getElementById("github-app-key-file-input");
    const file = fileInput.files[0];
    if (!file) {
      githubAppError("err_github_no_file");
      return;
    }
    let privateKeyB64;
    try {
      privateKeyB64 = await readFileAsBase64(file);
    } catch (err) {
      githubAppError("err_github_invalid_key_file");
      return;
    }
    const btn = document.getElementById("github-app-validate-submit");
    btn.disabled = true;
    setFrameStatus("github-app", "checking");
    const expectedWebhookUrl = `${renderService.service_url}/webhook`;
    let resp;
    try {
      resp = await fetch("/api/github/validate-app", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          app_id: Number(appIdRaw),
          private_key_b64: privateKeyB64,
          expected_webhook_url: expectedWebhookUrl,
          webhook_secret: ensureGithubAppWebhookSecret(),
        }),
      });
    } catch (err) {
      btn.disabled = false;
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      btn.disabled = false;
      githubAppError("err_github_unreachable");
      return;
    }
    btn.disabled = false;
    if (!body.valid) {
      setFrameStatus("github-app", "error");
      if (body.reason === "unauthorized") {
        githubAppError("err_github_invalid_credentials");
      } else if (body.reason === "invalid_key") {
        githubAppError("err_github_invalid_key_file");
      } else {
        githubAppError("err_github_unreachable");
      }
      return;
    }
    growFrameToFit("github-app", () => renderGithubAppChecklist(body));
    if (!body.all_ok) {
      setFrameStatus("github-app", "error");
      return;
    }
    // Already persisted server-side by /api/github/validate-app on success
    // (session_store, keyed by this frame's session cookie) -- nothing left
    // to store client-side.
    completeFrame("github-app", "account_prefix", body.installation.account_login);
  }

  function renderGithubAppChecklist(body) {
    lastGithubAppChecklistBody = body;
    const list = document.getElementById("github-app-checklist");
    list.innerHTML = "";
    const addRow = (label, ok) => {
      const li = document.createElement("li");
      li.className = ok ? "check-pass" : "check-fail";
      li.textContent = `${ok ? "✓" : "✗"} ${label}`;
      list.appendChild(li);
    };
    body.permissions.forEach((p) => {
      addRow(`${p.name}: ${p.wanted}${p.ok ? "" : ` (have: ${p.actual || "none"})`}`, p.ok);
    });
    body.events.forEach((e) => {
      addRow(`${t("frame2_check_event_prefix")}${e.name}`, e.ok);
    });
    if (body.installation.status === "found") {
      addRow(`${t("frame2_check_installation_found_prefix")}${body.installation.account_login}`, true);
    } else if (body.installation.status === "multiple") {
      addRow(t("frame2_check_installation_multiple"), false);
    } else {
      addRow(t("frame2_check_installation_none"), false);
    }
    addRow(t("frame2_check_webhook"), body.webhook.ok);
  }

  function base64UrlEncode(bytes) {
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function resetSupabaseConnectSection() {
    supabasePollGeneration++;
    document.getElementById("supabase-org-section").style.display = "none";
    document.getElementById("supabase-provisioning-section").style.display = "none";
    document.getElementById("supabase-check-status-submit").style.display = "none";
    document.getElementById("supabase-connect-section").style.display = "block";
    document.getElementById("supabase-error").textContent = "";
    // supabase-key-submit is disabled by every validateSupabaseKey() attempt
    // and only re-enabled by that same function's own success/failure
    // branches -- any other path that lands back on supabase-connect-section
    // (zero orgs, unauthorized/no_session, INIT_FAILED, a lock/unlock cycle)
    // must re-enable it here too, or the visitor is stuck on a screen with
    // no usable button at all.
    document.getElementById("supabase-key-submit").disabled = false;
    document.getElementById("supabase-org-submit").disabled = false;
    currentSupabaseErrorKey = null;
    currentSupabaseErrorMessage = null;
  }

  function supabaseError(key) {
    setFrameStatus("supabase", "error");
    currentSupabaseErrorKey = key;
    currentSupabaseErrorMessage = null;
    document.getElementById("supabase-error").textContent = t(key);
  }

  // Which fixed, fully-translated copy names the exact missing permission
  // for a given call context -- passed by each call site below, since only
  // the caller knows which Supabase API call actually produced a 403.
  const SUPABASE_MISSING_PERMISSION_KEYS = {
    organizations: "err_supabase_missing_organizations_permission",
    projects: "err_supabase_missing_projects_permission",
    organization_projects: "err_supabase_missing_organization_projects_permission",
    connection_pooling: "err_supabase_missing_connection_pooling_permission",
  };

  function supabaseErrorForReason(reason, message, permissionContext) {
    if (reason === "project_creation_rejected" && message) {
      // Recoverable, and token-independent: the stored access token and
      // chosen org are still valid -- only the specific create-project
      // request was rejected (e.g. a duplicate project name, or a
      // plan-level project cap). Stay on the org/name section so the
      // visitor can retry with a different name or org, rather than being
      // forced back to re-enter their access token for no reason.
      setFrameStatus("supabase", "error");
      currentSupabaseErrorKey = null;
      currentSupabaseErrorMessage = null;
      // Supabase's own error text, relayed verbatim (spec section 4) —
      // not a translated string, since it isn't one of ours.
      document.getElementById("supabase-error").textContent = message;
      return;
    }
    if (reason === "project_name_taken") {
      // Also token-independent: a naming collision with a project this
      // session doesn't own, not a permission problem. Same reasoning as
      // project_creation_rejected above -- stay on the org/name section,
      // the visitor just needs to pick a different name.
      supabaseError("err_supabase_project_name_taken");
      return;
    }
    if (reason === "insufficient_permissions" && SUPABASE_MISSING_PERMISSION_KEYS[permissionContext]) {
      // Supabase gives no way to edit a token's permissions after
      // creation -- the only real fix is a brand new token, so this is
      // fully our own translated copy naming the exact permission
      // (no Supabase relay needed, we already know precisely what's
      // missing) and reverts the frame back to the connect-section (key
      // input) rather than leaving the visitor on a dead-end screen.
      resetSupabaseConnectSection();
      supabaseError(SUPABASE_MISSING_PERMISSION_KEYS[permissionContext]);
      return;
    }
    if (reason === "insufficient_permissions") {
      // No known context (defensive fallback, e.g. a future call site that
      // forgets to pass one) -- same combined shape as before: our fixed
      // copy plus Supabase's relayed message when it provides one. Still
      // reverts to the connect-section for the same reason as above.
      resetSupabaseConnectSection();
      currentSupabaseErrorKey = "err_supabase_insufficient_permissions";
      currentSupabaseErrorMessage = message || null;
      document.getElementById("supabase-error").textContent =
        t("err_supabase_insufficient_permissions") + (message ? " " + message : "");
      return;
    }
    // Every other reason (unauthorized, no_session, rate_limited,
    // pooler_config_unavailable, supabase_unreachable, ...) is not
    // recoverable by retrying the same call in place -- revert to the
    // connect-section for a fresh attempt rather than leaving the visitor
    // on the provisioning screen or a bare retry button.
    resetSupabaseConnectSection();
    const key = {
      unauthorized: "err_supabase_reauthorize",
      no_session: "err_no_session",
      rate_limited: "err_supabase_rate_limited",
      pooler_config_unavailable: "err_supabase_pooler_config_unavailable",
    }[reason] || "err_supabase_unreachable";
    supabaseError(key);
  }

  // Every Supabase relay call after the initial OAuth redirect goes through
  // here. access_token never reaches the browser at all anymore (the server
  // reads it from the session, keyed by the onboarding_session cookie sent
  // automatically with every same-origin fetch) -- no client-side refresh
  // logic is needed either, since the server always uses its own
  // up-to-date stored token.
  async function callSupabaseRelay(endpoint, payload) {
    try {
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload || {}),
      });
      if (!resp.ok) throw new Error("bad status");
      return await resp.json();
    } catch (err) {
      return {valid: false, reason: "supabase_unreachable"};
    }
  }

  // Paste-and-validate, same shape as validateRenderKey() above: the PAT
  // is submitted once, validated server-side, and persisted into the
  // session on success (POST /api/supabase/validate-key) -- it never
  // touches sessionStorage/localStorage. Every later Supabase call in
  // this frame goes through callSupabaseRelay(), which sends no
  // credential at all (the server reads it back from the session).
  async function validateSupabaseKey() {
    const input = document.getElementById("supabase-key-input");
    const key = input.value.trim();
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    currentSupabaseErrorMessage = null;
    if (!key) {
      supabaseError("err_supabase_empty_key");
      return;
    }
    setFrameStatus("supabase", "checking");
    const submitBtn = document.getElementById("supabase-key-submit");
    submitBtn.disabled = true;
    // A project already exists in this session (an earlier create-project
    // succeeded) -- this submission is the error-recovery path (a new
    // token after a permission gap), not a fresh start, so the server must
    // merge api_key rather than wiping the already-known ref/db_pass. See
    // CLAUDE.md's sub-project 3 section.
    const stored = readStoredSupabase();
    const preserveProject = !!(stored && stored.ref);
    let resp, body;
    try {
      resp = await fetch("/api/supabase/validate-key", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key, preserve_project: preserveProject}),
      });
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      setFrameStatus("supabase", "ready");
      submitBtn.disabled = false;
      supabaseError("err_network");
      return;
    }
    if (!body.valid) {
      setFrameStatus("supabase", "ready");
      submitBtn.disabled = false;
      if (body.reason === "invalid_key") {
        supabaseError("err_supabase_invalid_key");
      } else {
        supabaseErrorForReason(body.reason, body.message, "organizations");
      }
      return;
    }
    input.value = "";
    submitBtn.disabled = false;
    if (body.orgs.length === 0) {
      resetSupabaseConnectSection();
      supabaseError("err_supabase_no_organizations");
      return;
    }
    // Revealing the org picker + name field grows the frame's content
    // height same as the GitHub App checklist does -- same fix applies.
    growFrameToFit("supabase", () => {
      const select = document.getElementById("supabase-org-select");
      select.innerHTML = "";
      body.orgs.forEach((org) => {
        const option = document.createElement("option");
        option.value = org.slug;
        option.textContent = org.name;
        select.appendChild(option);
      });
      // Convenience prefill when recovering from an error with a project
      // already known (organization_slug/name survive the token swap
      // above via preserve_project) -- lets the visitor just click
      // Continue instead of re-picking everything.
      if (stored && stored.organization_slug) {
        select.value = stored.organization_slug;
      }
      if (stored && stored.name) {
        document.getElementById("supabase-project-name-input").value = stored.name;
      }
      showSupabaseOrgSection();
    });
  }

  function showSupabaseOrgSection() {
    document.getElementById("supabase-connect-section").style.display = "none";
    document.getElementById("supabase-org-section").style.display = "block";
    frameEl("supabase").open = true;
    setFrameStatus("supabase", "choosing_org");
  }

  async function confirmSupabaseOrg() {
    const select = document.getElementById("supabase-org-select");
    const nameInput = document.getElementById("supabase-project-name-input");
    const name = nameInput.value.trim();
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    currentSupabaseErrorMessage = null;
    if (!name) {
      supabaseError("err_supabase_name_empty");
      return;
    }
    const submitBtn = document.getElementById("supabase-org-submit");
    submitBtn.disabled = true;
    // create-project's own request IS the provisioning call (Supabase
    // provisions the project synchronously within it, before the response
    // ever comes back) -- badging this "provisioning" only once that
    // request resolves left the header stuck on "Choose an organization"
    // for the entire round trip, which can take a few seconds.
    setFrameStatus("supabase", "provisioning");
    const ok = await kickOffProjectCreation(select.value, name);
    if (!ok) submitBtn.disabled = false;
  }

  async function kickOffProjectCreation(organizationSlug, name) {
    const body = await callSupabaseRelay("/api/supabase/create-project", {
      organization_slug: organizationSlug,
      name,
    });
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message, "organization_projects");
      return false;
    }
    // Non-secret continuity state for this page view (polling needs `ref`;
    // the final completeFrame call needs `name`; `organization_slug` lets a
    // later error-recovery resubmission prefill the org picker) -- not a
    // credential, so sessionStorage is fine here. db_pass/api_key never
    // reach the browser at all now (session_store.py holds them
    // server-side).
    try {
      sessionStorage.setItem(
        STORAGE_KEYS["supabase"],
        JSON.stringify({
          name: body.name, ref: body.ref, status: body.status,
          organization_slug: organizationSlug,
        }),
      );
    } catch (err) {
      supabaseError("err_supabase_storage_failed");
      return false;
    }
    showSupabaseProvisioning();
    pollUntilReady(Date.now(), supabasePollGeneration);
    return true;
  }

  function showSupabaseProvisioning() {
    // Swapping the org-picker section for the (shorter) provisioning
    // status section resizes the frame same as the checklist reveal does
    // -- same fix applies, this time usually shrinking rather than
    // growing (growFrameToFit animates either direction).
    growFrameToFit("supabase", () => {
      document.getElementById("supabase-connect-section").style.display = "none";
      document.getElementById("supabase-org-section").style.display = "none";
      document.getElementById("supabase-provisioning-section").style.display = "block";
      frameEl("supabase").open = true;
    });
    setFrameStatus("supabase", "provisioning");
  }

  const SUPABASE_POLL_INTERVAL_MS = 5000;
  const SUPABASE_POLL_TIMEOUT_MS = 300000;

  async function handleProjectStatusResult(body) {
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message, "projects");
      return "error";
    }
    if (body.status === "ACTIVE_HEALTHY") {
      // fetchSupabaseConnectionInfo() can itself fail (e.g. a token missing
      // Connection Pooling: Read) -- reporting "ready" regardless used to
      // make pollUntilReady stop as if the frame were done, with the
      // failure's error text on screen but no way to retry.
      const ok = await fetchSupabaseConnectionInfo();
      return ok ? "ready" : "error";
    }
    if (body.status === "INIT_FAILED") {
      // Terminal, unlike the poll-timeout case: the project will never
      // become healthy on its own, so put "Connect Supabase" back on
      // screen rather than leaving the provisioning section's dead end up.
      resetSupabaseConnectSection();
      supabaseError("err_supabase_provisioning_failed");
      return "error";
    }
    return "pending";
  }

  async function fetchProjectStatus() {
    return await callSupabaseRelay("/api/supabase/project-status");
  }

  async function pollUntilReady(startedAt, generation) {
    if (generation !== supabasePollGeneration) return;
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) return;
    const body = await fetchProjectStatus();
    if (generation !== supabasePollGeneration) return;
    const outcome = await handleProjectStatusResult(body);
    if (outcome === "error") {
      // handleProjectStatusResult() already reverted the frame back to the
      // connect-section via supabaseErrorForReason() -- a token's
      // permissions can't be edited after creation, so the only real fix
      // is a new token, and that resubmission (preserve_project) is what
      // keeps this already-created project from being orphaned. Nothing
      // left to do here; stop automatic polling.
      return;
    }
    if (outcome !== "pending") return;
    if (Date.now() - startedAt >= SUPABASE_POLL_TIMEOUT_MS) {
      supabaseError("err_supabase_provisioning_timeout");
      document.getElementById("supabase-check-status-submit").style.display = "inline-block";
      return;
    }
    setTimeout(() => { pollUntilReady(startedAt, generation); }, SUPABASE_POLL_INTERVAL_MS);
  }

  async function checkSupabaseStatusOnce() {
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) return;
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    currentSupabaseErrorMessage = null;
    const checkAgainBtn = document.getElementById("supabase-check-status-submit");
    checkAgainBtn.disabled = true;
    const generation = supabasePollGeneration;
    const body = await fetchProjectStatus();
    if (generation !== supabasePollGeneration) return;
    const outcome = await handleProjectStatusResult(body);
    if (outcome === "pending") {
      supabaseError("err_supabase_provisioning_timeout");
      // Still just waiting on Supabase, not an error -- re-enable the
      // button rather than leaving it disabled from the top of this
      // function forever.
      checkAgainBtn.style.display = "inline-block";
      checkAgainBtn.disabled = false;
    }
    // "error" here already reverted the frame back to the connect-section
    // via handleProjectStatusResult()'s own supabaseErrorForReason() call
    // -- the check-again button (on the now-hidden provisioning section)
    // needs no handling; resetSupabaseConnectSection() already hid it.
  }

  let currentRenderDeployErrorKey = null;
  const RENDER_DEPLOY_POLL_INTERVAL_MS = 10000;
  const RENDER_DEPLOY_POLL_TIMEOUT_MS = 900000;

  function resetRenderDeploySection() {
    renderDeployPollGeneration++;
    document.getElementById("render-deploy-trigger-section").style.display = "block";
    document.getElementById("render-deploy-polling-section").style.display = "none";
    document.getElementById("render-deploy-done-section").style.display = "none";
    document.getElementById("render-deploy-check-again-submit").style.display = "none";
    document.getElementById("render-deploy-check-again-submit").disabled = false;
    document.getElementById("render-deploy-trigger-submit").disabled = false;
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
  }

  function renderDeployError(key) {
    setFrameStatus("render-deploy", "error");
    currentRenderDeployErrorKey = key;
    document.getElementById("render-deploy-error").textContent = t(key);
  }

  function renderDeployErrorForReason(reason) {
    const map = {
      invalid_key: "err_render_deploy_invalid_key",
      service_not_found: "err_render_deploy_service_not_found",
      render_unreachable: "err_render_deploy_unreachable",
      no_session: "err_no_session",
      slot_config_seed_failed: "err_render_deploy_slot_config",
      supabase_not_ready: "err_no_session",
      model_not_callable: "err_render_deploy_model_not_callable",
      model_probe_unavailable: "err_render_deploy_model_probe_unavailable",
    };
    renderDeployError(map[reason] || "err_render_deploy_unreachable");
  }

  async function fetchRenderDeployStatus() {
    let resp;
    try {
      resp = await fetch("/api/render/deploy-status", {method: "POST"});
    } catch (err) {
      return {networkError: true};
    }
    try {
      if (!resp.ok) throw new Error("bad status");
      return await resp.json();
    } catch (err) {
      return {valid: false, reason: "render_unreachable"};
    }
  }

  function finishRenderDeploy() {
    const stored = readStoredRenderService();
    // The final payoff of the whole wizard (the dashboard link) -- this
    // frame stays open afterward, so an unanimated snap here would be the
    // most visible instance of the same issue the checklist had.
    growFrameToFit("render-deploy", () => {
      document.getElementById("render-deploy-polling-section").style.display = "none";
      document.getElementById("render-deploy-done-section").style.display = "block";
      const link = document.getElementById("render-deploy-service-link");
      link.href = stored ? stored.service_url : "";
      link.textContent = stored ? stored.service_url : "";
    });
    if (stored) {
      stored.deployed = true;
      sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify(stored));
    }
    // Unlike every other frame, this one stays open after completion: it's
    // the last frame, so there's no next step to draw attention to, and the
    // dashboard link just written above is the actual payoff -- collapsing
    // it here would hide the one thing worth seeing at the end of the wizard.
    // render-deploy is already in everReached by this point -- unlockFrame
    // added it when the frame first unlocked (necessarily before it could
    // ever be completed), and completeFrame adds it again regardless.
    completeFrame("render-deploy", null, null, "deploy_done", true);
  }

  function showRenderDeployTriggerAgain() {
    growFrameToFit("render-deploy", () => {
      document.getElementById("render-deploy-polling-section").style.display = "none";
      document.getElementById("render-deploy-trigger-section").style.display = "block";
    });
    document.getElementById("render-deploy-trigger-submit").disabled = false;
  }

  function handleRenderDeployStatusResult(body) {
    if (body.networkError) {
      renderDeployError("err_network");
      showRenderDeployTriggerAgain();
      return "error";
    }
    if (!body.valid) {
      renderDeployErrorForReason(body.reason);
      showRenderDeployTriggerAgain();
      return "error";
    }
    if (body.status === "live") {
      finishRenderDeploy();
      return "live";
    }
    if (body.status === "failed") {
      renderDeployError("err_render_deploy_failed");
      showRenderDeployTriggerAgain();
      return "error";
    }
    if (body.status === "canceled") {
      renderDeployError("err_render_deploy_canceled");
      showRenderDeployTriggerAgain();
      return "error";
    }
    // Only "in_progress" keeps polling now.
    return "pending";
  }

  async function pollRenderDeployStatus(startedAt, generation) {
    if (generation !== renderDeployPollGeneration) return;
    const body = await fetchRenderDeployStatus();
    if (generation !== renderDeployPollGeneration) return;
    const outcome = handleRenderDeployStatusResult(body);
    if (outcome !== "pending") return;
    if (Date.now() - startedAt >= RENDER_DEPLOY_POLL_TIMEOUT_MS) {
      renderDeployError("err_render_deploy_timeout");
      document.getElementById("render-deploy-check-again-submit").style.display = "inline-block";
      return;
    }
    setTimeout(() => { pollRenderDeployStatus(startedAt, generation); }, RENDER_DEPLOY_POLL_INTERVAL_MS);
  }

  async function checkRenderDeployStatusOnce() {
    const stored = readStoredRenderService();
    if (!stored || !stored.service_id || !stored.pending_deploy_id) return;
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
    const checkAgainBtn = document.getElementById("render-deploy-check-again-submit");
    checkAgainBtn.disabled = true;
    const generation = renderDeployPollGeneration;
    const body = await fetchRenderDeployStatus();
    if (generation !== renderDeployPollGeneration) return;
    const outcome = handleRenderDeployStatusResult(body);
    if (outcome === "pending") {
      renderDeployError("err_render_deploy_timeout");
      checkAgainBtn.style.display = "inline-block";
      checkAgainBtn.disabled = false;
    }
  }

  async function triggerRenderDeploy() {
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
    const stored = readStoredRenderService();
    if (!stored || !stored.service_id) {
      renderDeployError("err_render_deploy_no_service");
      return;
    }
    const triggerBtn = document.getElementById("render-deploy-trigger-submit");
    triggerBtn.disabled = true;
    // Bulk-pushes every completed frame's env vars to the visitor's Render
    // service in one call before triggering deploy -- no earlier frame
    // pushed incrementally anymore.
    let pushResp, pushBody;
    try {
      pushResp = await fetch("/api/render/bulk-push-env-vars", {method: "POST"});
      if (!pushResp.ok) throw new Error("bad status");
      pushBody = await pushResp.json();
    } catch (err) {
      triggerBtn.disabled = false;
      renderDeployError("err_network");
      return;
    }
    if (!pushBody.valid) {
      triggerBtn.disabled = false;
      renderDeployErrorForReason(pushBody.reason);
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/render/trigger-deploy", {method: "POST"});
    } catch (err) {
      triggerBtn.disabled = false;
      renderDeployError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      triggerBtn.disabled = false;
      renderDeployError("err_render_deploy_unreachable");
      return;
    }
    if (!body.valid) {
      triggerBtn.disabled = false;
      renderDeployErrorForReason(body.reason);
      return;
    }
    stored.pending_deploy_id = body.deploy_id;
    sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify(stored));
    growFrameToFit("render-deploy", () => {
      document.getElementById("render-deploy-trigger-section").style.display = "none";
      document.getElementById("render-deploy-polling-section").style.display = "block";
    });
    setFrameStatus("render-deploy", "deploying");
    pollRenderDeployStatus(Date.now(), renderDeployPollGeneration);
  }

  // Returns whether the frame actually completed -- callers must not treat
  // "the status call succeeded" as "the frame is done" without checking
  // this, since a permission-shaped (or any other) connection-info failure
  // here does not mean the project stopped existing.
  async function fetchSupabaseConnectionInfo() {
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) {
      // Polling already reported "ready" and stopped by this point — a bare
      // return here would leave the frame stuck at "Provisioning…" forever
      // with no error and no button. Also genuinely terminal (missing local
      // state that can't be recovered by waiting), so reset the same way as
      // the other dead ends above.
      resetSupabaseConnectSection();
      supabaseError("err_supabase_callback_invalid");
      return false;
    }
    // Assembles and stores the full DATABASE_URL server-side now (db_pass
    // never left the server to begin with) -- this call returns only a
    // verdict, never db_user/db_host/db_port/db_name.
    const body = await callSupabaseRelay("/api/supabase/connection-info");
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message, "connection_pooling");
      return false;
    }
    completeFrame("supabase", "project_prefix", stored.name);
    return true;
  }

  // Server-driven now, not a sessionStorage read: GET /api/session is the
  // source of truth for which frames are already done (session_store.py,
  // identified by the onboarding_session cookie -- survives a mobile
  // browser destroying this tab's sessionStorage, which is the whole
  // reason this wizard moved off the earlier stateless-relay design). Any
  // frame reflected here mirrors its own non-secret display fields into
  // the local per-frame sessionStorage record afterward, purely so later
  // same-page-load code (e.g. github-app's webhook URL instructions, the
  // render-deploy frame) can keep reading that local record the way it
  // already does after a fresh in-page completion.
  async function restoreFromSession() {
    let body;
    try {
      const resp = await fetch("/api/session");
      body = await resp.json();
    } catch (err) {
      return; // treat a network failure on load like a fresh visitor
    }
    const frames = body.frames || {};

    if (frames["render-key"]) {
      completeFrame("render-key", "owner_prefix", frames["render-key"].display.owner_name);
    }
    if (frames["render-service"]) {
      const {service_id: serviceId, service_url: serviceUrl} = frames["render-service"].display;
      // Merge onto whatever's already in the local mirror rather than
      // replacing it outright -- on an ordinary same-tab reload (as
      // opposed to the mobile tab-discard case this whole restore path
      // exists for), sessionStorage already has this frame's own
      // `deployed`/`pending_deploy_id` fields from earlier in the same
      // browsing session; overwriting unconditionally would discard
      // render-deploy's resumable state on every normal reload, not just
      // the tab-discard one.
      try {
        const existing = readStoredRenderService() || {};
        sessionStorage.setItem(
          STORAGE_KEYS["render-service"],
          JSON.stringify({...existing, service_id: serviceId, service_url: serviceUrl}),
        );
        sessionStorage.setItem(RENDER_SERVICE_URL_KEY, serviceUrl);
      } catch (err) {
        // best-effort -- the frame still shows as complete this page view
        // even if the local mirror can't be written.
      }
      completeFrame("render-service", "url_prefix", serviceUrl);
    }
    if (frames["dashboard-auth"]) {
      completeFrame("dashboard-auth", "restored", null);
    }
    if (frames["github-app"]) {
      completeFrame("github-app", "restored", null);
    }
    const supabaseFrame = frames["supabase"];
    if (supabaseFrame && supabaseFrame.complete) {
      completeFrame("supabase", "project_prefix", supabaseFrame.display.name);
    } else if (supabaseFrame && supabaseFrame.provisioning) {
      // Project created, but connection-info hasn't completed yet --
      // resume the provisioning poll where it left off. The local mirror
      // needs {ref} for pollUntilReady()/fetchSupabaseConnectionInfo()'s
      // own readStoredSupabase() checks, and {name} for the eventual
      // completeFrame() call.
      try {
        sessionStorage.setItem(
          STORAGE_KEYS["supabase"],
          JSON.stringify({ref: supabaseFrame.display.ref, name: supabaseFrame.display.name}),
        );
      } catch (err) {
        // best-effort -- falls through to showing the frame as ready to
        // provision again if the mirror can't be written.
      }
      showSupabaseProvisioning();
      pollUntilReady(Date.now(), supabasePollGeneration);
    }
    if (frames["llm-provider"]) {
      const provider = frames["llm-provider"].display.provider;
      completeFrame("llm-provider", "provider_prefix", LLM_PROVIDER_LABEL_KEY[provider] || provider);
    }
    if (frames["uptime-pinger"]) {
      completeFrame("uptime-pinger", "restored", null);
    }

    // GET /api/session is the primary source for render-deploy's own
    // resumption too (2026-09-08 fix -- it used to be local-only, which
    // left a revisit with no sessionStorage mirror left, e.g. a new device
    // or the mobile tab-discard scenario the whole server-side-session
    // redesign exists to guard against, unable to tell the service was
    // already deployed and showing the Deploy button again even though it
    // was live). The local mirror (renderServiceState) is still consulted
    // as a fallback -- a same-tab reload immediately after a live
    // completion/trigger, before this fetch could persist it server-side,
    // or the GET /api/session round-trip failing outright (frames stays
    // {} in that case, from the early return above).
    const renderDeployFrame = frames["render-deploy"];
    const renderServiceState = readStoredRenderService();
    const deployedServiceUrl = renderDeployFrame && renderDeployFrame.complete
      ? renderDeployFrame.display.service_url
      : renderServiceState && renderServiceState.deployed && renderServiceState.service_url;
    const pendingDeployId = renderDeployFrame && renderDeployFrame.provisioning
      ? renderDeployFrame.display.pending_deploy_id
      : renderServiceState && renderServiceState.pending_deploy_id;
    if (deployedServiceUrl) {
      // Keep the local mirror in sync with the server-reported state --
      // downstream same-page-view code (lockFrame("render-deploy")'s own
      // local clear on a later redo) already expects to find `deployed`
      // there the way it does right after a live in-page completion.
      try {
        const existing = readStoredRenderService() || {};
        sessionStorage.setItem(
          STORAGE_KEYS["render-service"],
          JSON.stringify({...existing, deployed: true, service_url: deployedServiceUrl}),
        );
      } catch (err) {
        // best-effort -- the frame still shows as done this page view even
        // if the local mirror can't be written.
      }
      // render-deploy-trigger-section has no `style="display: none"` in its
      // raw HTML (unlike the polling/done sections) -- the live completion
      // path (triggerRenderDeploy() -> finishRenderDeploy()) never needs to
      // hide it here because triggerRenderDeploy() already hid it earlier
      // in the same script instance. This is a fresh script instance with
      // none of that history, so it must be hidden explicitly or it shows
      // the "Deploy" button and the completed link at the same time.
      document.getElementById("render-deploy-trigger-section").style.display = "none";
      document.getElementById("render-deploy-polling-section").style.display = "none";
      document.getElementById("render-deploy-done-section").style.display = "block";
      const link = document.getElementById("render-deploy-service-link");
      link.href = deployedServiceUrl;
      link.textContent = deployedServiceUrl;
      completeFrame("render-deploy", null, null, "deploy_done", true);
    } else if (pendingDeployId) {
      try {
        const existing = readStoredRenderService() || {};
        sessionStorage.setItem(
          STORAGE_KEYS["render-service"],
          JSON.stringify({...existing, pending_deploy_id: pendingDeployId}),
        );
      } catch (err) {
        // best-effort -- "Check again" just won't be armed this page view
        // if the local mirror can't be written; the poll below still runs.
      }
      document.getElementById("render-deploy-trigger-section").style.display = "none";
      document.getElementById("render-deploy-polling-section").style.display = "block";
      // Same gap as the "deployed" branch above, one step earlier: a
      // visitor who reloads mid-deploy must see this frame genuinely open,
      // matching the live in-session state (unlocked the moment it was
      // ever reached, since triggerRenderDeploy() can only ever run against
      // an already-unlocked frame) -- not collapsed+locked, which is what
      // this frame starts as per its raw HTML on every fresh script load.
      unlockFrame("render-deploy");
      setFrameStatus("render-deploy", "deploying");
      pollRenderDeployStatus(Date.now(), renderDeployPollGeneration);
    }
  }

  function guardLockedFrames() {
    document.querySelectorAll(".frame").forEach((el) => {
      // Prevent the native <details> toggle before it happens -- a locked
      // frame must never visibly open at all, not open-then-flicker-closed.
      const summary = el.querySelector("summary");
      if (summary) {
        summary.addEventListener("click", (event) => {
          if (el.dataset.locked === "true") event.preventDefault();
        });
      }
      // Kept as defense-in-depth for any non-click path that can still set
      // `.open` (e.g. programmatic toggling from outside this guard).
      // dataset.stayOpen is the one deliberate exception: render-deploy
      // stays locked (no "Change" button) even once done, but must remain
      // visibly open rather than collapsing like every other completed
      // frame -- see completeFrame's own keepOpen comment. A native
      // <details>'s "toggle" event fires asynchronously (queued), not
      // synchronously at the moment `.open` is assigned, so by the time
      // this listener runs, dataset.locked is already "true" regardless of
      // statement order in the caller -- stayOpen is a separate flag for
      // exactly that reason, not something orderable away.
      el.addEventListener("toggle", () => {
        if (el.open && el.dataset.locked === "true" && el.dataset.stayOpen !== "true") {
          el.open = false;
        }
      });
    });
  }

  // Drives the frame-hinge signature interaction (see the .frame-body
  // comment above) for both directions via the Web Animations API --
  // native <details> can only reveal/hide content instantly, it has no
  // way to animate its own collapse, and CSS keyframes triggered by the
  // [open] attribute turned out unreliable for the open direction too.
  //
  // Two non-obvious things this depends on, found the hard way while
  // tuning this:
  // 1. .frame-body's own padding-bottom and border-top are real CSS box
  //    model, not "content" -- animating only `height` to 0 leaves them
  //    showing as a residual sliver (~19px) throughout the "closed"
  //    portion of the animation, which then vanishes in one visible jump
  //    the instant `open` actually flips. Animating padding-bottom and
  //    border-top-width down to 0 in lockstep with height removes that
  //    residual entirely.
  // 2. `fill: "forwards"` is required so a finished animation's held end
  //    state doesn't lapse (and snap back to the pre-animation style)
  //    during the gap between the animation finishing and its `onfinish`
  //    callback running -- but a fill:"forwards" animation stays resident
  //    once finished, so a later animation on the same element must
  //    explicitly cancel it first, or repeated open/close toggling piles
  //    up conflicting held animations instead of replacing the old one.
  // Populated per frame id by wireFrameHingeAnimations() below; lets code
  // elsewhere (completeFrame) trigger the same animated collapse a header
  // click does, instead of setting `el.open = false` directly -- a direct
  // set bypasses both the click handler and the animation entirely, since
  // neither is a real toggle-via-click. closeFrameAnimated() is the one
  // correct way to close a frame from anywhere in this file.
  const frameHingeControllers = {};
  function closeFrameAnimated(id, onDone) {
    const controller = frameHingeControllers[id];
    if (controller) {
      controller.close(onDone);
    } else {
      // Not wired (reduced motion, or pre-init) -- instant fallback.
      frameEl(id).open = false;
      if (onDone) onDone();
    }
  }

  // Wrap a DOM mutation that changes an already-open frame's content
  // height (a validation result, a dynamically-populated list, ...) so
  // the frame resizes with the same hinge motion open/close use, instead
  // of an instant snap or, before the cancel() fix in
  // wireFrameHingeAnimations, overflowing past a height a finished
  // animation was still holding. `mutateFn` must be passed in rather than
  // already applied -- the old size has to be pinned before the mutation
  // happens, or the browser's own reflow beats the animation to it (see
  // growToFit's own comment). Falls back to just running `mutateFn`
  // unanimated if the frame isn't open or isn't wired (reduced motion).
  function growFrameToFit(id, mutateFn) {
    const controller = frameHingeControllers[id];
    if (controller && controller.grow) controller.grow(mutateFn);
    else mutateFn();
  }

  function wireFrameHingeAnimations() {
    const HINGE_DURATION = 600;
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (prefersReducedMotion) return; // native instant toggle only

    document.querySelectorAll("details.frame").forEach((el) => {
      const summary = el.querySelector(":scope > summary");
      const body = el.querySelector(":scope > .frame-body");
      if (!summary || !body) return;
      const frameId = el.id.replace(/^frame-/, "");

      const cs = getComputedStyle(body);
      const fullPadBottom = cs.paddingBottom;
      const fullBorderTop = cs.borderTopWidth;

      function hingeFrames(targetHeightPx) {
        return [
          {height: "0px", paddingBottom: "0px", borderTopWidth: "0px",
           transform: "perspective(700px) rotateX(-20deg) translateY(-8px)", opacity: 0.3},
          {height: targetHeightPx + "px", paddingBottom: fullPadBottom, borderTopWidth: fullBorderTop,
           transform: "perspective(700px) rotateX(0deg) translateY(0)", opacity: 1},
        ];
      }

      let currentAnim = null;
      function playHinge(keyframes, onfinish) {
        if (currentAnim) currentAnim.cancel();
        const anim = body.animate(keyframes, {duration: HINGE_DURATION, easing: "ease", fill: "forwards"});
        currentAnim = anim;
        anim.onfinish = () => {
          // A fill:"forwards" animation stays resident and keeps forcing
          // its final keyframe values (height, transform, opacity, ...)
          // even after it finishes -- cancel() releases that held effect
          // back to the normal CSS cascade (the inline style resets below
          // clear the box back to natural auto-height layout). Without
          // this, the frame's rendered height stays pinned at whatever it
          // was the moment it finished opening, so content added later
          // (e.g. the GitHub App checklist after a failed validation)
          // overflows past the box instead of growing it -- scrollHeight
          // reports the true larger size the whole time, only the
          // rendered box stays stuck.
          anim.cancel();
          if (currentAnim === anim) currentAnim = null;
          onfinish();
        };
      }

      // `animating` is advisory only (used by nothing now, kept for any
      // future debugging/instrumentation) -- it must never gate whether an
      // animation is allowed to start. It used to: a growFrameToFit() call
      // followed immediately by completeFrame()'s closeFrameAnimated()
      // (the exact sequence every successful re-validation after a fixed
      // error takes) would set `animating = true` for the grow and then
      // have the close silently no-op against that flag with no onDone to
      // retry later -- the frame would never collapse. playHinge() already
      // cancels whatever animation is currently running before starting a
      // new one, so both functions below always measure the box's actual
      // current rendered state (getBoundingClientRect, which reflects
      // reality even mid-animation) and proceed unconditionally; letting a
      // grow get interrupted by a close (or vice versa) and smoothly
      // redirected is correct, silently dropping the interrupting request
      // is not.
      let animating = false;

      function animatedClose(onDone) {
        if (!el.open) {
          if (onDone) onDone(); // already closed -- nothing to animate
          return;
        }
        // Closing: measure the box's actual current height (not
        // scrollHeight -- this must reflect wherever it visually is right
        // now, including mid-grow, not its full natural content size),
        // then animate height/padding/border and transform/opacity down
        // together, and only remove `open` once that finishes.
        animating = true;
        const currentHeight = body.getBoundingClientRect().height;
        body.style.overflow = "hidden";
        playHinge([...hingeFrames(currentHeight)].reverse(), () => {
          el.open = false;
          body.style.overflow = "";
          body.style.height = "";
          body.style.paddingBottom = "";
          body.style.borderTopWidth = "";
          animating = false;
          if (onDone) onDone();
        });
      }
      // Grows (or shrinks) an already-open frame around a DOM mutation
      // that changes its content height -- e.g. the GitHub App checklist
      // appearing once a validation call resolves. `mutateFn` must be the
      // thing that actually changes the content: with no inline height
      // constraint at rest (the steady state after open/close settle),
      // the browser reflows the box to the new content size the INSTANT
      // it's mutated, before any JS after that point gets to run -- so
      // the old size has to be pinned *before* the mutation, not measured
      // after it, or there's nothing left to animate from (confirmed live:
      // calling this after the mutation just snapped, no visible tween).
      function growToFit(mutateFn) {
        if (!el.open) { mutateFn(); return; }
        const oldHeight = body.getBoundingClientRect().height;
        body.style.overflow = "hidden";
        body.style.height = oldHeight + "px";
        mutateFn();
        // scrollHeight still reports the true full content size even
        // while overflow is clipped and height is pinned.
        const newHeight = body.scrollHeight;
        if (Math.abs(newHeight - oldHeight) < 1) {
          body.style.overflow = "";
          body.style.height = "";
          return;
        }
        animating = true;
        const steadyState = (h) => ({
          height: h + "px", paddingBottom: fullPadBottom, borderTopWidth: fullBorderTop,
          transform: "perspective(700px) rotateX(0deg) translateY(0)", opacity: 1,
        });
        playHinge([steadyState(oldHeight), steadyState(newHeight)], () => {
          body.style.overflow = "";
          body.style.height = "";
          animating = false;
        });
      }

      frameHingeControllers[frameId] = {close: animatedClose, grow: growToFit};

      summary.addEventListener("click", (event) => {
        if (el.dataset.locked === "true") return; // guardLockedFrames handles this
        if (el.open) {
          event.preventDefault();
          animatedClose();
        }
        // Opening falls through to the native toggle; handled below.
      });

      el.addEventListener("toggle", () => {
        if (!el.open) return;
        // The native toggle already revealed the content at its natural
        // height -- read that as the animation's target, then immediately
        // clamp back to 0 before the browser paints so the grow-animation
        // has a real starting point instead of flashing full-height first.
        const targetHeight = body.scrollHeight;
        body.style.overflow = "hidden";
        body.style.height = "0px";
        body.style.paddingBottom = "0px";
        body.style.borderTopWidth = "0px";
        playHinge(hingeFrames(targetHeight), () => {
          body.style.overflow = "";
          body.style.height = "";
          body.style.paddingBottom = "";
          body.style.borderTopWidth = "";
        });
      });
    });
  }

  function attachChangeButtons() {
    document.querySelectorAll(".frame-change").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        beginChange(btn.dataset.frame);
      });
    });
  }

  function positionPopup(popup, anchorBtn) {
    const margin = 8;
    const rect = anchorBtn.getBoundingClientRect();
    const isRtl = document.documentElement.getAttribute("dir") === "rtl";
    popup.style.top = `${rect.bottom + margin}px`;
    popup.style.left = "auto";
    popup.style.right = "auto";
    const popupWidth = popup.offsetWidth;
    if (isRtl) {
      const maxRight = window.innerWidth - popupWidth - margin;
      const right = Math.min(Math.max(window.innerWidth - rect.right, margin), maxRight);
      popup.style.right = `${right}px`;
    } else {
      const maxLeft = window.innerWidth - popupWidth - margin;
      const left = Math.max(margin, Math.min(rect.left, maxLeft));
      popup.style.left = `${left}px`;
    }
  }

  function openPopup(id, anchorBtn) {
    closeAllPopups();
    const backdrop = document.getElementById(id);
    backdrop.classList.add("open");
    positionPopup(backdrop.querySelector(".popup"), anchorBtn);
  }

  function closeAllPopups() {
    document.querySelectorAll(".popup-backdrop").forEach((el) => el.classList.remove("open"));
  }

  // Enter-to-advance / Enter-to-submit: within whichever section of a frame
  // is currently visible, pressing Enter in any field but the last one
  // moves focus to the next field; pressing Enter in the last one triggers
  // the same action a click on the frame's current primary button would.
  // Visually-hidden file inputs (the custom .file-field control) are
  // deliberately left out of every list below -- a focused file input
  // already has its own native Enter behavior (opens the file picker),
  // which this must not interfere with.
  const FRAME_ENTER_CONFIG = {
    "render-key": {
      fields: () => ["render-key-input"],
      button: () => "render-key-submit",
    },
    "render-service": {
      fields: () => ["render-service-repo-input", "render-service-name-input"],
      button: () => "render-service-submit",
    },
    "dashboard-auth": {
      fields: () => [
        "dashboard-auth-username-input",
        "dashboard-auth-password-input",
        "dashboard-auth-ack-checkbox",
      ],
      button: () => "dashboard-auth-submit",
    },
    "github-app": {
      fields: () => ["github-app-id-input"],
      button: () => "github-app-validate-submit",
    },
    "supabase": {
      fields: () => (
        document.getElementById("supabase-org-section").style.display !== "none"
          ? ["supabase-org-select", "supabase-project-name-input"]
          : ["supabase-key-input"]
      ),
      button: () => (
        document.getElementById("supabase-org-section").style.display !== "none"
          ? "supabase-org-submit"
          : "supabase-key-submit"
      ),
    },
    "llm-provider": {
      fields: () => {
        if (document.getElementById("llm-provider-model-section").style.display !== "none") {
          return ["llm-provider-model-select"];
        }
        const provider = getSelectedLlmProvider();
        // Vertex's credential is file-only -- no text field to press Enter in.
        return provider === "gemini" || provider === "groq" ? ["llm-provider-api-key-input"] : [];
      },
      button: () => (
        document.getElementById("llm-provider-model-section").style.display !== "none"
          ? "llm-provider-continue-submit"
          : "llm-provider-validate-submit"
      ),
    },
    "uptime-pinger": {
      fields: () => ["uptime-pinger-api-key-input"],
      button: () => "uptime-pinger-submit",
    },
  };

  function handleFrameEnterKey(event) {
    if (event.key !== "Enter") return;
    const target = event.target;
    const frame = target.closest("details.frame");
    if (!frame) return;
    const config = FRAME_ENTER_CONFIG[frame.id.replace(/^frame-/, "")];
    if (!config) return;
    const fields = config.fields();
    const idx = fields.indexOf(target.id);
    if (idx === -1) return;
    event.preventDefault();
    if (idx < fields.length - 1) {
      document.getElementById(fields[idx + 1]).focus();
      return;
    }
    const btn = document.getElementById(config.button());
    if (btn && !btn.disabled) btn.click();
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("render-key-submit").addEventListener("click", validateRenderKey);
    document.addEventListener("keydown", handleFrameEnterKey);
    document.getElementById("render-service-submit").addEventListener("click", createRenderService);
    document.getElementById("dashboard-auth-submit").addEventListener("click", submitDashboardAuth);
    document.getElementById("dashboard-auth-generate-submit").addEventListener("click", fillGeneratedDashboardAuthPassword);
    document.getElementById("dashboard-auth-password-toggle").addEventListener("click", toggleDashboardAuthPasswordVisibility);
    document.querySelectorAll(".copy-btn").forEach((button) => {
      button.addEventListener("click", () => copyValueToClipboard(button));
    });
    document.getElementById("render-deploy-trigger-submit").addEventListener("click", triggerRenderDeploy);
    document.getElementById("render-deploy-check-again-submit").addEventListener("click", checkRenderDeployStatusOnce);
    document.getElementById("github-app-validate-submit").addEventListener("click", validateGithubApp);
    wireFileField("github-app-key-file-input", "github-app-key-file-name");
    wireFileField("llm-provider-file-input", "llm-provider-file-name");
    document.getElementById("supabase-key-submit").addEventListener("click", validateSupabaseKey);
    document.getElementById("supabase-org-submit").addEventListener("click", confirmSupabaseOrg);
    document.getElementById("supabase-check-status-submit").addEventListener("click", checkSupabaseStatusOnce);
    document.getElementById("llm-provider-validate-submit").addEventListener("click", validateLlmProviderCredential);
    document.getElementById("llm-provider-continue-submit").addEventListener("click", confirmLlmProviderModel);
    document.getElementById("llm-provider-project-select").addEventListener("change", onVertexPairChanged);
    document.getElementById("llm-provider-location-select").addEventListener("change", onVertexPairChanged);
    loadVertexLocations();
    document.getElementById("uptime-pinger-submit").addEventListener("click", submitUptimeRobotKey);
    document.getElementById("frame-uptime-pinger").addEventListener("toggle", () => {
      if (document.getElementById("frame-uptime-pinger").open) {
        refreshUptimePingerBlockedState();
      }
    });
    document.querySelectorAll('input[name="llm-provider-choice"]').forEach((r) => {
      r.addEventListener("change", handleLlmProviderChoice);
    });
    guardLockedFrames();
    wireFrameHingeAnimations();
    attachChangeButtons();

    document.getElementById("themeToggleBtn").addEventListener("click", (event) => openPopup("themePopupBackdrop", event.currentTarget));
    document.getElementById("langToggleBtn").addEventListener("click", (event) => openPopup("langPopupBackdrop", event.currentTarget));
    document.querySelectorAll(".popup-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeAllPopups();
      });
    });
    document.querySelectorAll('input[name="theme"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyTheme(event.target.value); closeAllPopups(); });
    });
    document.querySelectorAll('input[name="lang"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyLanguage(event.target.value); closeAllPopups(); });
    });

    applyLanguage(currentLang);
    restoreFromSession();

    document.getElementById("wizard-reset-button").addEventListener("click", () => {
      document.getElementById("wizard-reset-confirm-dialog").showModal();
    });
    document.getElementById("wizard-reset-confirm-yes").addEventListener("click", resetWizard);
    document.getElementById("wizard-reset-confirm-no").addEventListener("click", () => {
      document.getElementById("wizard-reset-confirm-dialog").close();
    });
  });
</script>
</body>
</html>
